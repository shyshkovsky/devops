server {
    listen 80;

    # Static frontend files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Contact form → contact service (longer prefix wins over /api/).
    # X-Forwarded-For is overwritten, so clients can't spoof their IP for rate limiting.
    location = /api/contact {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass         http://contact:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
    }

    # API requests → FastAPI
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}

# Helpdesk ticket demo on its own port
server {
    listen 8081;

    client_max_body_size 16k;

    location / {
        proxy_pass         http://tickets:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
    }
}
