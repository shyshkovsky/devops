services:

  backend:
    build:
      context: ./backend
    networks:
      - app-net

  # Contact form: email (SMTP) + Telegram bot. Secrets live in contact-service/.env
  # (copy .env.example). Needs Docker Compose >= 2.24 for the optional env_file.
  contact:
    build:
      context: ./contact-service
    restart: unless-stopped
    env_file:
      - path: ./contact-service/.env
        required: false
    environment:
      - TRUST_PROXY=1
    networks:
      - app-net

  # Helpdesk ticket system demo, published through Nginx on port 8081.
  tickets:
    build:
      context: ./ticket-demo
    restart: unless-stopped
    environment:
      - TRUST_PROXY=1
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - contact
      - tickets
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
